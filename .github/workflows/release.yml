name: release

on:
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches Cargo.toml version
        id: version
        run: |
          version="$(awk '
            /^\[workspace\.package\]/ { f = 1; next }
            /^\[/ { f = 0 }
            f && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi

  e2e:
    uses: ./.github/workflows/ci.yml

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.target }}"
          cc="CC_${{ matrix.target }}"
          echo "${cc//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p yard --release --locked --target "${{ matrix.target }}"

      - name: Stage
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/yard" \
            "dist/yard-${{ needs.version.outputs.version }}-${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yard-${{ matrix.target }}
          path: dist/yard-${{ needs.version.outputs.version }}-${{ matrix.target }}
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: cargo build -p yard --release --locked --target aarch64-apple-darwin

      - name: Stage
        run: |
          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/yard" \
            "dist/yard-${{ needs.version.outputs.version }}-aarch64-apple-darwin"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yard-aarch64-apple-darwin
          path: dist/yard-${{ needs.version.outputs.version }}-aarch64-apple-darwin
          if-no-files-found: error

  release:
    needs: [version, e2e, build, macos]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore annotated tag
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum yard-* >SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "yard ${{ needs.version.outputs.version }}" --notes-from-tag dist/yard-* dist/SHA256SUMS
