name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PINFOLD_VERSION: 0.2.3

jobs:
  e2e:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Rootless podman
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo apt-get update
          sudo apt-get install -y dbus-user-session
          # Without a user session podman ignores --memory, and pinfold refuses every box.
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user enable --now dbus.socket
          podman system migrate
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      - name: Install pinfold
        run: |
          base="https://github.com/adamaltmejd/pinfold/releases/download/v${PINFOLD_VERSION}"
          asset="pinfold-${PINFOLD_VERSION}-$(uname -m)-unknown-linux-musl"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          sha256sum --ignore-missing -c SHA256SUMS
          sudo install -m 0755 "$asset" /usr/local/bin/pinfold
          pinfold --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The scaffold's Dockerfile starts FROM this local image; a fresh host
      # has none until it is built.
      - run: pinfold build --profile default
      - name: Fetch verified public Durable image inputs
        env:
          YARD_E2E_DURABLE_INPUTS: ${{ runner.temp }}/yard-durable-inputs
        run: sh runners/durable-audit/fetch-build-inputs.sh "$YARD_E2E_DURABLE_INPUTS"
      - run: cargo test -p e2e --locked -- --show-output
        env:
          YARD_E2E_DURABLE_INPUTS: ${{ runner.temp }}/yard-durable-inputs

  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record Cargo.toml version
        id: version
        run: |
          version="$(awk '
            /^\[workspace\.package\]/ { f = 1; next }
            /^\[/ { f = 0 }
            f && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "${{ matrix.target }}"
          cc="CC_${{ matrix.target }}"
          echo "${cc//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p yard --release --locked --target "${{ matrix.target }}"

      - name: Stage
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/yard" \
            "dist/yard-${{ needs.version.outputs.version }}-${{ matrix.target }}"

      - name: Record artifact identity
        shell: bash
        env:
          YARD_ASSET_TARGET: ${{ matrix.target }}
          YARD_ASSET_VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="dist/yard-${YARD_ASSET_VERSION}-${YARD_ASSET_TARGET}"
          "$asset" version --json > dist/version.json
          (cd dist && shasum -a 256 "${asset#dist/}" > SHA256SUMS)
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          target = os.environ['YARD_ASSET_TARGET']
          version = os.environ['YARD_ASSET_VERSION']
          asset = pathlib.Path(f'dist/yard-{version}-{target}')
          reported = json.loads(pathlib.Path('dist/version.json').read_text())
          if reported.get('version') != version:
              raise SystemExit(f'version mismatch: {reported!r}')
          record = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'target': target, 'version': version, 'asset': asset.name,
                    'sha256': hashlib.sha256(asset.read_bytes()).hexdigest(),
                    'reported_version': reported,
                    'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip()}
          pathlib.Path('dist/manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yard-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: cargo build -p yard --release --locked --target aarch64-apple-darwin

      - name: Stage
        run: |
          mkdir -p dist
          cp "target/aarch64-apple-darwin/release/yard" \
            "dist/yard-${{ needs.version.outputs.version }}-aarch64-apple-darwin"

      - name: Record artifact identity
        shell: bash
        env:
          YARD_ASSET_TARGET: aarch64-apple-darwin
          YARD_ASSET_VERSION: ${{ needs.version.outputs.version }}
        run: |
          asset="dist/yard-${YARD_ASSET_VERSION}-${YARD_ASSET_TARGET}"
          "$asset" version --json > dist/version.json
          (cd dist && shasum -a 256 "${asset#dist/}" > SHA256SUMS)
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          target = os.environ['YARD_ASSET_TARGET']
          version = os.environ['YARD_ASSET_VERSION']
          asset = pathlib.Path(f'dist/yard-{version}-{target}')
          reported = json.loads(pathlib.Path('dist/version.json').read_text())
          if reported.get('version') != version:
              raise SystemExit(f'version mismatch: {reported!r}')
          record = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'target': target, 'version': version, 'asset': asset.name,
                    'sha256': hashlib.sha256(asset.read_bytes()).hexdigest(),
                    'reported_version': reported,
                    'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip()}
          pathlib.Path('dist/manifest.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yard-aarch64-apple-darwin
          path: dist/*
          if-no-files-found: error
