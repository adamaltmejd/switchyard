name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-shim:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build exact proposed Apple shim patch
        run: bash validation-packet/build-shim.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-apple-shim-candidate
          path: shim-dist/
          if-no-files-found: error
  validate-native-fix:
    needs: build-shim
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 20
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: y80-apple-shim-candidate
          path: shim-dist/
      - name: Reproduce, install patched builder, and verify native image contents
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          python3 validation-packet/validate-builder.py
      - name: Retain runtime and native validation evidence
        if: ${{ always() && env.YARD_APPLE_FIX_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-apple-patched-native-evidence
          path: ${{ env.YARD_APPLE_FIX_EVIDENCE }}
          if-no-files-found: error
  qualify-mac:
    needs: validate-native-fix
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 35
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    env:
      YARD_SOURCE_SHA: a4151c7101aba74f3ac88486afe60e7ebc278bbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Qualify exact reviewed Yard candidate
        shell: bash
        run: bash validation-packet/qualify-mac.sh
      - name: Preserve complete qualification evidence
        if: ${{ always() && env.YARD_MAC_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-a4151c-mac-patched-builder-qualification
          path: ${{ env.YARD_MAC_EVIDENCE }}
          if-no-files-found: error
