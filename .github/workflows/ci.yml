name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-startup-diagnostic:
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 15
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    steps:
      - name: Observe original legacy startup failure
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 && "$(id -un)" == runner ]]
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:$PATH"
          export YARD_MAC_DIAGNOSTIC=$(mktemp -d "${TMPDIR:-/tmp}/yard-legacy-diag.XXXXXX")
          printf 'YARD_MAC_DIAGNOSTIC=%s\n' "$YARD_MAC_DIAGNOSTIC" >> "$GITHUB_ENV"
          export YARD_REAL_CONTAINER=$(command -v container)
          export YARD_DIAG_RUNTIME_ERRORS="$YARD_MAC_DIAGNOSTIC/container-run.stderr"
          mkdir "$YARD_MAC_DIAGNOSTIC/bin"
          python3 - "$YARD_REAL_CONTAINER" "$YARD_DIAG_RUNTIME_ERRORS" "$YARD_MAC_DIAGNOSTIC/bin/container" <<'YARD_PY'
          import sys,shlex
          from pathlib import Path
          real,errors,path=sys.argv[1:]
          p=Path(path)
          p.write_text('#!/bin/bash\nif [[ "$1" == run ]]; then exec '+shlex.quote(real)+' "$@" 2>> '+shlex.quote(errors)+'; fi\nexec '+shlex.quote(real)+' "$@"\n')
          p.chmod(0o755)
          YARD_PY
          export PATH="$YARD_MAC_DIAGNOSTIC/bin:$PATH"
          [[ "$(shasum -a 256 "$HOME/.local/bin/pinfold" | cut -d' ' -f1)" == 611253a0f44d1c0c337f778c743131d30904634f652e979d3ecb4bc2dcc7bc7e ]]
          cd /tmp/yard-validate.5qmVHO/source
          [[ "$(git rev-parse HEAD)" == b670ca0840c1891819696d21eb3712a1ffd8cd90 ]]
          [[ -z "$(git status --porcelain)" ]]
          export CARGO_TARGET_DIR=/tmp/yard-validate.5qmVHO/target
          export CARGO_INCREMENTAL=0
          export YARD_E2E_DURABLE_INPUTS=/tmp/yard-validate.5qmVHO/durable-inputs
          set +e
          cargo test -p e2e --locked an_upgrade_preserves_ended_planner_proposals_and_limit_overrides -- --show-output > "$YARD_MAC_DIAGNOSTIC/native.log" 2>&1
          yard_diagnostic_exit=$?
          set -e
          printf '%s\n' "$yard_diagnostic_exit" > "$YARD_MAC_DIAGNOSTIC/test-exit.txt"
          cat "$YARD_MAC_DIAGNOSTIC/native.log"
          if [[ -f "$YARD_DIAG_RUNTIME_ERRORS" ]]; then cat "$YARD_DIAG_RUNTIME_ERRORS"; fi
          exit "$yard_diagnostic_exit"
      - name: Preserve diagnostic evidence
        if: ${{ always() && env.YARD_MAC_DIAGNOSTIC != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-mac-legacy-diagnostic-20261016
          path: ${{ env.YARD_MAC_DIAGNOSTIC }}
          if-no-files-found: error
