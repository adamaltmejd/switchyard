name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 6
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    steps:
      - name: Read builder and configuration identities
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          [[ "$(id -un)" == runner ]]
          yard_out=$(mktemp -d /private/tmp/yard-apple-fix-preflight.XXXXXX)
          printf 'YARD_PREFLIGHT=%s\n' "$yard_out" >> "$GITHUB_ENV"
          container --version > "$yard_out/runtime.txt"
          container builder stop --help > "$yard_out/builder-stop-help.txt"
          container system status > "$yard_out/system-status.txt"
          container image inspect ghcr.io/apple/container-builder-shim/builder:0.13.1 > "$yard_out/image.json"
          container list --all --format json > "$yard_out/containers.json"
          container exec buildkit sha256sum /usr/local/bin/container-builder-shim /usr/bin/buildkitd > "$yard_out/executables.sha256"
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,hashlib,tomllib
          rows=[]
          for p in [Path.home()/'.config/container/config.toml',Path.home()/'Library/Application Support/com.apple.container/config/config.toml',Path('/usr/local/etc/container/config.toml'),Path('/opt/homebrew/etc/container/config.toml')]:
           r={'path':str(p),'exists':p.exists()}
           if p.exists():
            data=p.read_bytes();d=tomllib.loads(data.decode());r.update(sha256=hashlib.sha256(data).hexdigest(),mode=oct(p.stat().st_mode&0o777),build=d.get('build',{}))
           rows.append(r)
          print(json.dumps(rows,indent=2))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && env.YARD_PREFLIGHT != '' }}
        with:
          name: y80-apple-fix-preflight-20261016
          path: ${{ env.YARD_PREFLIGHT }}
