name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-build-context-diagnostic:
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 12
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    steps:
      - name: Compare controlled public image contexts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 && "$(id -un)" == runner ]]
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:$PATH"
          [[ "$(shasum -a 256 "$HOME/.local/bin/pinfold" | cut -d' ' -f1)" == 611253a0f44d1c0c337f778c743131d30904634f652e979d3ecb4bc2dcc7bc7e ]]
          yard_probe_dir=$(mktemp -d "${TMPDIR:-/tmp}/yard-build-context.XXXXXX")
          export YARD_MAC_DIAGNOSTIC="$yard_probe_dir/evidence"
          mkdir "$YARD_MAC_DIAGNOSTIC"
          printf 'YARD_MAC_DIAGNOSTIC=%s\n' "$YARD_MAC_DIAGNOSTIC" >> "$GITHUB_ENV"
          pinfold build --profile default > "$YARD_MAC_DIAGNOSTIC/profile.log" 2>&1
          python3 - <<'YARD_PY'
          from pathlib import Path
          import os,json,subprocess,shutil,hashlib,time
          out=Path(os.environ['YARD_MAC_DIAGNOSTIC']).resolve();work=out.parent/'contexts';work.mkdir();inputs=Path('/tmp/yard-validate.ayicFQ/durable-inputs');assert inputs.is_dir()
          records=[]
          for case in ['small-control','large-32MiB','public-node-archive','public-input-directory']:
           ctx=work/case;ctx.mkdir();copy='COPY payload /probe-payload'
           if case=='small-control':(ctx/'payload').write_text('owned tiny build context\n')
           elif case=='large-32MiB':
            with (ctx/'payload').open('wb') as f:
             for _ in range(32):f.write(b'\0'*1024**2)
           elif case=='public-node-archive':shutil.copyfile(next(inputs.rglob('node-*.tar.gz')),ctx/'payload')
           else:shutil.copytree(inputs,ctx/'build-inputs');copy='COPY build-inputs/ /probe-inputs/'
           (ctx/'Dockerfile').write_text('FROM pinfold/profile-default:latest\n'+copy+'\nLABEL dev.yard.investigation="y80-tar-'+case+'"\n')
           name='yard-y80-tar-'+str(os.getpid())+'-'+case.lower()
           r={'case':case,'context':str(ctx),'name':name,'files':[{'path':str(p.relative_to(ctx)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(ctx.rglob('*')) if p.is_file()]};started=time.monotonic()
           with (out/(case+'.log')).open('wb') as log:
            p=subprocess.run(['pinfold','image','build',name,'--containerfile',str(ctx/'Dockerfile'),'--context',str(ctx),'--label','dev.yard.investigation=y80-tar-20261016'],stdout=log,stderr=subprocess.STDOUT,timeout=180)
           r.update(exit=p.returncode,wall_seconds=time.monotonic()-started)
           cleanup=subprocess.run(['pinfold','image','rm',name],capture_output=True,text=True,timeout=30);r['own_name_retirement']={'exit':cleanup.returncode,'stdout':cleanup.stdout,'stderr':cleanup.stderr}
           records.append(r);(out/'report.json').write_text(json.dumps({'cases':records,'scope':'distinctpubliccontrolledbuildcontexts; no boxes/models/runtimeconfiguration or globalcleanup'},indent=2)+'\n');print(json.dumps({k:r[k] for k in ['case','exit','wall_seconds','context']}),flush=True)
           if p.returncode:
            direct=name+'-direct'
            with (out/(case+'-direct-container.log')).open('wb') as log:
             p=subprocess.run(['container','build','--file',str(ctx/'Dockerfile'),'--tag',direct,str(ctx)],stdout=log,stderr=subprocess.STDOUT,timeout=180)
            r['direct_container_exit']=p.returncode
            cleanup=subprocess.run(['container','image','delete',direct],capture_output=True,text=True,timeout=30);r['direct_own_tag_removal']={'exit':cleanup.returncode,'stdout':cleanup.stdout,'stderr':cleanup.stderr}
            (out/'report.json').write_text(json.dumps({'cases':records,'scope':'samefailingcontextviaactualdirectruntime; allfailuresretained, notqualificationretry; onlyownuniqueimagetagsretired'},indent=2)+'\n');print(json.dumps({'direct_container_exit':p.returncode}),flush=True)
            break
          YARD_PY
      - name: Preserve diagnostic evidence
        if: ${{ always() && env.YARD_MAC_DIAGNOSTIC != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-mac-build-context-diagnostic-20261016
          path: ${{ env.YARD_MAC_DIAGNOSTIC }}
          if-no-files-found: error
