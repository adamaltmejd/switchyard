name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-native-fresh-default:
    runs-on: [self-hosted, macOS, ARM64, switchyard-macos]
    timeout-minutes: 12
    concurrency:
      group: yard-operator-mac
      cancel-in-progress: false
    steps:
      - name: Reproduce through native container with default environment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 && "$(id -un)" == runner ]]
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:$PATH"
          [[ "$(shasum -a 256 "$HOME/.local/bin/pinfold" | cut -d' ' -f1)" == 611253a0f44d1c0c337f778c743131d30904634f652e979d3ecb4bc2dcc7bc7e ]]
          yard_probe_dir=$(mktemp -d "${TMPDIR:-/tmp}/yard-native-fresh.XXXXXX")
          export YARD_MAC_DIAGNOSTIC="$yard_probe_dir/evidence"
          mkdir "$YARD_MAC_DIAGNOSTIC"
          printf 'YARD_MAC_DIAGNOSTIC=%s\n' "$YARD_MAC_DIAGNOSTIC" >> "$GITHUB_ENV"
          python3 - <<'YARD_PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import os,json,subprocess,shutil,threading,time
          out=Path(os.environ['YARD_MAC_DIAGNOSTIC']).resolve();base=out.parent/'contexts';base.mkdir();original=Path('/private/tmp/yard-parallel-context.fZ4owi/contexts');barrier=threading.Barrier(8);env=os.environ.copy();env.pop('NO_COLOR',None);env.pop('BUILDKIT_COLORS',None);rows=[]
          for i in range(8):
           ctx=base/str(i);shutil.copytree(original/str(i),ctx,copy_function=shutil.copyfile);rows.append({'case':i,'kind':'public-input-directory' if i<2 else 'small-control','context':str(ctx),'name':'yard-y80-native-fresh-'+str(os.getpid())+'-'+str(i)})
          def build(r):
           ctx=Path(r['context']);barrier.wait(timeout=30);started=time.monotonic()
           with (out/(str(r['case'])+'.log')).open('wb') as log:p=subprocess.run(['container','build','--file',str(ctx/'.yard/Dockerfile'),'--tag',r['name'],str(ctx)],env=env,stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,timeout=180)
           return {**r,'exit':p.returncode,'wall_seconds':time.monotonic()-started}
          with ThreadPoolExecutor(max_workers=8) as executor:rows=list(executor.map(build,rows))
          for r in rows:
           p=subprocess.run(['container','image','delete',r['name']],env=env,capture_output=True,text=True,timeout=30);r['only_own_tag_retirement']={'exit':p.returncode,'stdout':p.stdout,'stderr':p.stderr}
          report={'scope':'DirectApplecontaineronly; freshbyteidenticalcopies/defaultcache/defaultTMPDIR/8waynormalconcurrency; samecolorenvnormalizationasPinfold. NoYard/Pinfoldinvocation, no boxes/models/runtimeconfig/cacheclear; ownuniquetagsretiredafterallbuilds.','cases':rows};(out/'report.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          YARD_PY
      - name: Preserve build diagnostic evidence
        if: ${{ always() && env.YARD_MAC_DIAGNOSTIC != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: y80-mac-native-fresh-default-20261016
          path: ${{ env.YARD_MAC_DIAGNOSTIC }}
          if-no-files-found: error
