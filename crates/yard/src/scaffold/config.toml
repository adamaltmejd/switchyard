# Switchyard project configuration. Changes land only through `yard_sync`.
max_lanes = 1
approve = "manual"

[target]
ref = "main"
protected_paths = ["AGENTS.md", "CLAUDE.md", ".agents/", ".claude/", ".codex/", ".pi/"]

[isolation]
egress = []

[agents.default]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[workflows.default]
implementer = "default"
review = ["correctness"]
access = "write"

[workflows.plan]
access = "read-only"
review = "none"

[review]
max_rounds = 3
blocking = "P1"

[review.seats.correctness]
agent = "default"
instructions = "Review the change for correctness bugs."

# Replace this minimal gate with the project checks before operator sync.
[gates.check]
command = "git show --format= --check HEAD"
stage = "candidate"

# Seats bind separately to frozen candidates and read-only joins.
[workflows.trials]
review = ["correctness", "trial-2", "trial-3", "trial-4", "trial-5"]

[review.seats.trial-2]
agent = "default"
instructions = "Review the change for correctness bugs."

[review.seats.trial-3]
agent = "default"
instructions = "Review the change for correctness bugs."

[review.seats.trial-4]
agent = "default"
instructions = "Review the change for correctness bugs."

[review.seats.trial-5]
agent = "default"
instructions = "Review the change for correctness bugs."

[workflows.join]
review = ["left", "right", "join"]

[review.seats.left]
agent = "review-left"
instructions = "Review correctness and isolation."

[review.seats.right]
agent = "review-right"
instructions = "Review recovery and identity."

[review.seats.join]
agent = "default"
instructions = "Review the exact joined results and preserve required blocks."

[agents.trial-1]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[agents.trial-2]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[agents.trial-3]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[agents.trial-4]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[agents.trial-5]
harness = "pi"
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
effort = "high"

[profiles.implementer]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "" }
access = "write-allowed"
outputs = { "result" = "candidate" }
outcomes = ["complete"]

[profiles.reviewer]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Review the change for correctness bugs." }
access = "read-only"
outputs = { "result" = "verdict" }
outcomes = ["complete", "blocked"]

[profiles.selector]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Select the best frozen candidate using its bound reviews. Publish its exact identity." }
access = "read-only"
outputs = { "result" = "selection" }
outcomes = ["complete"]

[profiles.finding-selector]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Group actionable findings from the exact supplied review sources. Publish groups with every selected contributor." }
access = "read-only"
outputs = { "result" = "finding-selection" }
outcomes = ["complete"]

[profiles.cleanup]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Simplify the selected module under AGENTS.md. Commit changes and publish a report; remediation publishes the final candidate." }
access = "write-allowed"
outputs = { "result" = "report" }
outcomes = ["complete"]

[profiles.test-audit]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Audit tests under AGENTS.md. Publish findings without changing files.", "skills" = [".agents/skills/test-audit/SKILL.md"], "references" = [".agents/skills/test-audit/sweep.md"] }
access = "read-only"
outputs = { "result" = "report" }
outcomes = ["complete"]

[profiles.left]
runner = { "kind" = "agent", "agent" = "review-left", "instructions" = "Review correctness and isolation." }
access = "read-only"
outputs = { "result" = "verdict" }
outcomes = ["complete", "blocked"]

[profiles.right]
runner = { "kind" = "agent", "agent" = "review-right", "instructions" = "Review recovery and identity." }
access = "read-only"
outputs = { "result" = "verdict" }
outcomes = ["complete", "blocked"]

[profiles.join]
runner = { "kind" = "agent", "agent" = "default", "instructions" = "Review the exact joined results and preserve required blocks." }
access = "read-only"
outputs = { "result" = "verdict" }
outcomes = ["complete", "blocked"]

[profiles.trial-1]
runner = { "kind" = "agent", "agent" = "trial-1", "instructions" = "" }
access = "write-allowed"
outputs = { "result" = "candidate" }
outcomes = ["complete"]

[profiles.trial-2]
