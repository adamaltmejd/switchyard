[presets.ordinary.nodes]
"implementer" = { "profile" = "implementer", "inputs" = { "feedback" = { "output" = "feedback", "kind" = "verdict" } }, "routes" = { "complete" = [{ "to" = "candidate-gate-check" }] } }
"candidate-gate-check" = { "runner" = { "kind" = "command", "gate" = "check" }, "access" = "write-allowed", "outputs" = { "result" = "verdict" }, "outcomes" = ["complete", "failed"], "inputs" = { "candidate" = { "node" = "implementer", "output" = "result", "kind" = "candidate" } }, "requires" = ["candidate"], "routes" = { "complete" = [{ "to" = "review-0" }], "failed" = [{ "to" = "implementer", "repeat" = 1 }] } }
"review-0" = { "profile" = "reviewer", "inputs" = { "candidate" = { "node" = "implementer", "output" = "result", "kind" = "candidate" } }, "requires" = ["candidate"], "routes" = { "complete" = [{ "to" = "landing-gate-check" }], "blocked" = [{ "to" = "implementer", "repeat" = 3 }] } }
"landing-gate-check" = { "runner" = { "kind" = "command", "gate" = "check" }, "access" = "write-allowed", "outputs" = { "result" = "verdict" }, "outcomes" = ["complete"], "inputs" = { "merged" = { "output" = "merged", "kind" = "candidate" } }, "requires" = ["merged"], "routes" = {  } }

